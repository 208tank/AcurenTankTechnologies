# Maintainer tool: on every push to a work branch, build the static site and
# push it to the `site-preview` branch so it can be downloaded and tested
# before merging. Also reports TypeScript errors without failing.
name: Build preview

on:
  push:
    branches-ignore: [main, site-preview]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          yarn install

      - name: Type check (report only)
        run: yarn tsc --noEmit || echo "::warning::TypeScript reported errors (see log above)."

      - name: Build static site
        run: yarn build

      - name: Push build to the site-preview branch
        run: |
          cd out
          git init -q -b site-preview
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Preview of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" site-preview
